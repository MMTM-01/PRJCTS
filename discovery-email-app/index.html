<title>Momentum Email Builder</title>

<style id="appcss">
  :root{
    --gold:#B2963D; --gold-2:#D6BD5E; --gold-deep:#8F7830;
    --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE3;
    --ink:#1C1A15; --muted:#79787E; --line:#E3DFD3;
    --bar:#121212; --bar-ink:#F5F2EA;
    --focus:#B2963D; --danger:#B4443C; --ok:#38761d;
    --shadow:0 1px 2px rgba(28,26,21,.06),0 8px 24px -12px rgba(28,26,21,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161411; --surface:#1F1D19; --surface-2:#26231E;
      --ink:#ECE8DE; --muted:#A9A8AD; --line:#33302A;
      --bar:#0E0D0B; --bar-ink:#F5F2EA;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161411; --surface:#1F1D19; --surface-2:#26231E;
    --ink:#ECE8DE; --muted:#A9A8AD; --line:#33302A;
    --bar:#0E0D0B; --bar-ink:#F5F2EA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Raleway","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    font-size:15px; line-height:1.45;
  }
  h1,h2,h3,.hd{font-family:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif}

  .bar{
    position:sticky; top:0; z-index:40;
    background:var(--bar); color:var(--bar-ink);
    display:flex; align-items:center; gap:16px;
    padding:10px 20px; border-bottom:2px solid var(--gold);
  }
  .bar img{height:34px; width:auto; display:block}
  .bar .apptitle{
    font-family:"Poppins",system-ui,sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase; color:var(--gold-2);
    border-left:1px solid rgba(255,255,255,.25); padding-left:16px;
  }
  .bar .spacer{flex:1}
  .btn{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:13px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink);
    padding:8px 14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--gold)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--focus); outline-offset:1px;
  }
  .btn.gold{background:var(--gold); border-color:var(--gold); color:#171308}
  .btn.gold:hover{background:var(--gold-2); border-color:var(--gold-2)}
  .btn.ghostbar{background:transparent; color:var(--bar-ink); border-color:rgba(255,255,255,.3)}
  .btn.ghostbar:hover{border-color:var(--gold-2); color:var(--gold-2)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger)}
  .btn.sm{padding:5px 10px; font-size:12px}

  .barseg{display:flex; border:1px solid rgba(255,255,255,.3); border-radius:7px; overflow:hidden}
  .barseg button{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:12.5px;
    padding:7px 14px; border:0; background:transparent; color:var(--bar-ink); cursor:pointer;
  }
  .barseg button.on{background:var(--gold); color:#171308}

  .chip{
    font-family:"Poppins",system-ui,sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.06em; border-radius:999px; padding:4px 12px;
    border:1px solid rgba(255,255,255,.3); color:var(--bar-ink); white-space:nowrap;
  }
  .chip::before{content:"● "; font-size:9px; vertical-align:1px}
  .chip.shared{border-color:#4c8c3f; color:#9CD08B}
  .chip.local{border-color:var(--gold-2); color:var(--gold-2)}
  .chip.ro{border-color:#c9803a; color:#E8B378}

  #statusBanner{
    display:none; padding:9px 20px; font-size:13.5px;
    background:color-mix(in srgb, var(--gold) 14%, var(--surface));
    border-bottom:1px solid color-mix(in srgb, var(--gold) 40%, var(--surface));
  }
  #statusBanner.show{display:block}

  .wrap{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:22px; padding:22px; max-width:1500px; margin:0 auto;
    align-items:start;
  }
  @media (max-width:980px){
    .wrap{grid-template-columns:minmax(0,1fr)}
    .preview-pane{position:static !important; max-height:none !important}
  }

  /* ---------- form ---------- */
  .formcol{display:flex; flex-direction:column; gap:14px; min-width:0}
  .savebar{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:12px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .savebar .savemsg{font-size:13.5px; color:var(--muted); flex:1; min-width:140px}
  .savebar .savemsg b{color:var(--ink); font-weight:600}
  details.card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  details.card > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px;
    padding:13px 16px; user-select:none;
  }
  details.card > summary::-webkit-details-marker{display:none}
  .num{
    font-family:"Poppins",system-ui,sans-serif; font-weight:700; font-size:12px;
    color:var(--gold-deep); background:color-mix(in srgb, var(--gold) 16%, var(--surface));
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--surface));
    border-radius:5px; padding:2px 7px; letter-spacing:.06em;
  }
  :root[data-theme="dark"] .num{color:var(--gold-2)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .num{color:var(--gold-2)} }
  summary .st{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:13.5px;
    letter-spacing:.12em; text-transform:uppercase;
  }
  summary .chev{margin-left:auto; color:var(--muted); transition:transform .15s ease}
  details[open] > summary .chev{transform:rotate(90deg)}
  @media (prefers-reduced-motion: reduce){ summary .chev{transition:none} }
  .cbody{padding:4px 16px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
  .row{display:grid; gap:12px}
  .row.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
  @media (max-width:560px){ .row.c2,.row.c3,.row.c4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
  .f{display:flex; flex-direction:column; gap:4px; min-width:0}
  .lbl{
    font-family:"Poppins",system-ui,sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  input[type=text],input[type=number],input[type=date],input[type=search],textarea,select{
    font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%;
  }
  textarea{resize:vertical; min-height:60px}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb, var(--muted) 72%, var(--bg))}
  .hint{font-size:12.5px; color:var(--muted)}
  .subhd{
    font-family:"Poppins",system-ui,sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);
    margin-top:6px; padding-top:10px; border-top:1px dashed var(--line);
  }
  :root[data-theme="dark"] .subhd{color:var(--gold-2)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .subhd{color:var(--gold-2)} }

  .ffa-grid{display:grid; grid-template-columns:minmax(0,1fr) 74px 74px 64px; gap:8px; align-items:center}
  .ffa-grid .colhd{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:"Poppins",system-ui,sans-serif}
  .gap-badge{
    font-family:"Poppins",system-ui,sans-serif; font-variant-numeric:tabular-nums;
    text-align:center; font-size:13px; font-weight:600; color:var(--muted);
    border:1px dashed var(--line); border-radius:6px; padding:7px 0;
  }
  .gap-badge.hot{color:#171308; background:var(--gold-2); border:1px solid var(--gold); font-weight:700}

  .fms-grid{display:grid; grid-template-columns:150px minmax(0,1fr) 86px; gap:8px; align-items:center}
  .fms-grid .tname{font-size:13.5px; font-weight:600}
  .fms-total{
    display:flex; align-items:center; gap:10px; justify-content:flex-end;
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .fms-total .pill{
    background:var(--bar); color:var(--gold-2); border-radius:999px; padding:5px 14px;
    letter-spacing:.04em;
  }
  .chk{display:flex; align-items:flex-start; gap:8px; font-size:13.5px}
  .chk input{width:auto; margin-top:2px; accent-color:var(--gold)}

  /* ---------- preview ---------- */
  .preview-pane{
    position:sticky; top:76px; display:flex; flex-direction:column; gap:10px;
    max-height:calc(100vh - 96px); min-width:0;
  }
  .ptools{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; box-shadow:var(--shadow);
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .seg button{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:12.5px;
    padding:7px 13px; border:0; background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .seg button.on{background:var(--bar); color:var(--gold-2)}
  .ptools .spacer{flex:1}
  .tometa{font-size:12.5px; color:var(--muted); padding:0 2px}
  .tometa b{color:var(--ink); font-weight:600}
  .paper{
    background:#FFFFFF; border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); overflow-y:auto; overflow-x:auto; flex:1; min-height:300px;
    padding:0;
  }
  .paper-inner{padding:26px 28px}

  /* ---------- roster ---------- */
  .rwrap{max-width:1000px; margin:0 auto; padding:22px; display:flex; flex-direction:column; gap:14px}
  .rtools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .rtools input[type=search]{flex:1; min-width:180px}
  .rhead{
    font-family:"Poppins",system-ui,sans-serif; font-size:13.5px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  }
  .ccard{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
  .ccard > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:14px; padding:14px 16px; user-select:none; flex-wrap:wrap}
  .ccard > summary::-webkit-details-marker{display:none}
  .cname{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:15.5px}
  .cmeta{font-size:12.5px; color:var(--muted)}
  .cmeta b{color:var(--ink); font-weight:600}
  .ccard .cbody2{border-top:1px solid var(--line); padding:6px 16px 14px}
  .vrow{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap}
  .vrow:last-of-type{border-bottom:0}
  .vinfo{flex:1; min-width:160px; font-size:13.5px}
  .vinfo .vd{font-weight:600; font-family:"Poppins",system-ui,sans-serif}
  .vinfo .vm{color:var(--muted); font-size:12.5px}
  .cfoot{display:flex; justify-content:flex-end; padding-top:10px}
  .empty{
    text-align:center; color:var(--muted); padding:44px 20px;
    background:var(--surface); border:1px dashed var(--line); border-radius:10px;
  }
  .draftcard{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line);
    border-left:4px solid var(--gold); border-radius:10px;
    box-shadow:var(--shadow); padding:13px 16px;
  }
  .draftcard .dinfo{flex:1; min-width:180px}
  .draftcard .dtitle{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:14.5px}
  .draftcard .dmeta{font-size:12.5px; color:var(--muted); margin-top:2px}

  .modalback{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
    background:rgba(12,11,9,.55); padding:20px;
  }
  .modal{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-top:4px solid var(--gold); border-radius:12px; box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
    max-width:440px; width:100%; padding:22px 24px;
  }
  .modal .mtitle{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:17px; margin-bottom:8px;
  }
  .modal .mbody{font-size:14.5px; color:var(--muted); line-height:1.5; white-space:pre-line}
  .modal .mactions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px}
  .btn.solid-danger{background:var(--danger); border-color:var(--danger); color:#fff}
  .btn.solid-danger:hover{background:#9c3a33; border-color:#9c3a33}
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--bar); color:var(--bar-ink); border:1px solid var(--gold);
    border-radius:8px; padding:10px 18px; font-family:"Poppins",system-ui,sans-serif;
    font-size:13.5px; font-weight:600; opacity:0; transition:all .25s ease; z-index:60;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){ #toast{transition:opacity .1s linear} }
  @media (max-width:720px){
    .bar{gap:10px; padding:10px 14px; flex-wrap:wrap}
    .bar img{height:26px}
    .bar .apptitle{display:none}
  }
</style>

/* ================= helpers ================= */
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }
function firstName(name) { return (name || "").split(/\s+/)[0] || ""; }
function genId(prefix) {
  let core;
  try { core = crypto.randomUUID().slice(0, 8); }
  catch (e) { core = Math.random().toString(36).slice(2, 10); }
  return prefix + "_" + core;
}
function niceDate(iso) {
  if (!iso) return "";
  const [y, m, day] = iso.split("-").map(Number);
  if (!y) return "";
  return new Date(y, m - 1, day).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}
function niceStamp(iso) {
  const dt = new Date(iso);
  if (isNaN(dt)) return "";
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
/* The published page runs in a sandboxed frame where window.confirm() is
   ignored and returns false, so every confirmation uses this in-page dialog. */
function askConfirm(opts) {
  return new Promise(resolve => {
    const back = document.getElementById("modalBack");
    const ok = document.getElementById("modalOk");
    const cancel = document.getElementById("modalCancel");
    document.getElementById("modalTitle").textContent = opts.title || "Are you sure?";
    document.getElementById("modalBody").textContent = opts.message || "";
    ok.textContent = opts.confirmLabel || "Confirm";
    ok.classList.toggle("solid-danger", !!opts.danger);
    ok.classList.toggle("gold", !opts.danger);
    cancel.textContent = opts.cancelLabel || "Cancel";
    back.hidden = false;
    const prev = document.activeElement;
    ok.focus();
    function done(val) {
      back.hidden = true;
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      back.removeEventListener("mousedown", onBack);
      document.removeEventListener("keydown", onKey, true);
      if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* gone */ } }
      resolve(val);
    }
    function onOk() { done(true); }
    function onCancel() { done(false); }
    function onBack(e) { if (e.target === back) done(false); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); done(false); }
      else if (e.key === "Enter") { e.preventDefault(); done(true); }
      else if (e.key === "Tab") { /* keep focus on the two buttons */
        e.preventDefault();
        (document.activeElement === ok ? cancel : ok).focus();
      }
    }
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    back.addEventListener("mousedown", onBack);
    document.addEventListener("keydown", onKey, true);
  });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ================= form state ================= */
function collect() {
  const d = {};
  document.querySelectorAll("#form [data-key]").forEach(el => {
    d[el.dataset.key] = el.type === "checkbox" ? el.checked : el.value.trim();
  });
  return d;
}
function fillForm(saved) {
  document.querySelectorAll("#form [data-key]").forEach(el => {
    if (!(el.dataset.key in saved)) {
      if (el.type === "checkbox") el.checked = el.dataset.key === "shoulderCaveat" || el.dataset.key.startsWith("res");
      else el.value = "";
      return;
    }
    if (el.type === "checkbox") el.checked = !!saved[el.dataset.key];
    else el.value = saved[el.dataset.key] == null ? "" : saved[el.dataset.key];
  });
}
function restoreDraft() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { /* corrupt draft */ }
  if (saved) fillForm(saved);
}
function persistDraft(d) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { /* storage full/blocked */ }
}
function clearForm(keepTrainer) {
  const trainer = keepTrainer === false ? "" : rememberedTrainer();
  document.querySelectorAll("#form [data-key]").forEach(el => {
    if (el.type === "checkbox") el.checked = el.dataset.key === "shoulderCaveat" || el.dataset.key.startsWith("res");
    else el.value = "";
  });
  const dateEl = document.querySelector('[data-key="date"]');
  if (dateEl) dateEl.value = todayIso();
  const trainerEl = document.querySelector('[data-key="trainer"]');
  if (trainerEl && trainer) trainerEl.value = trainer;
}
function todayIso() {
  const now = new Date();
  return now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
}
function rememberedTrainer() {
  try { return localStorage.getItem(TRAINER_KEY) || ""; } catch (e) { return ""; }
}
function rememberTrainer(name) {
  if (!name) return;
  try { localStorage.setItem(TRAINER_KEY, name); } catch (e) { /* storage blocked */ }
}
/* A draft counts as "has content" when a trainer has typed anything a
   clear would destroy. Date and trainer are auto-filled, so they don't count. */
function draftHasContent(d) {
  const data = d || collect();
  for (const el of document.querySelectorAll("#form [data-key]")) {
    const key = el.dataset.key;
    if (key === "date" || key === "trainer") continue;
    if (el.type === "checkbox") {
      const def = key === "shoulderCaveat" || key.startsWith("res");
      if (data[key] !== def) return true;
    } else if (data[key]) return true;
  }
  return false;
}
function draftLabel(d) {
  const data = d || collect();
  return data.name ? data.name : "an unnamed client";
}
/* Confirm before destroying unsaved work; silent when the form is empty. */
async function confirmDiscardDraft() {
  if (!draftHasContent()) return true;
  return askConfirm({
    title: "Discard this unsaved form?",
    message: "The form for " + draftLabel() + " has not been saved to the portal. Discarding it cannot be undone.",
    confirmLabel: "Discard",
    danger: true
  });
}
function discardDraft() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  clearForm();
  openedVisit = null;
  updateSaveBar();
  refresh();
}

/* ================= derived values ================= */
function fmsRows(d) {
  return FMS_TESTS
    .map(([key, label]) => ({ label, note: d[key + "Note"], score: d[key + "Score"] }))
    .filter(r => r.note || r.score !== "");
}
function fmsTotal(d) {
  let sum = 0, any = false;
  if (d.valgusScore !== "" && d.valgusScore != null) { sum += +d.valgusScore; any = true; }
  for (const [key] of FMS_TESTS) {
    const v = d[key + "Score"];
    if (v !== "" && v != null) { sum += +v; any = true; }
  }
  return any ? sum : null;
}
function ffaWeaknesses(d) {
  const rows = [];
  for (let i = 1; i <= 7; i++) {
    const name = d["ffaChar" + i], ideal = +d["ffaIdeal" + i] || 0, self = +d["ffaSelf" + i] || 0;
    if (name && ideal && self) rows.push({ name, gap: ideal - self });
  }
  return rows.sort((a, b) => b.gap - a.gap).slice(0, 3).filter(r => r.gap > 0);
}
function extraResources(d) {
  const out = [];
  if (d.resGuide) out.push("Momentum Restaurant Guide");
  if (d.resSweet) out.push("Sweet Tooth Solutions E-Book");
  if (d.resAudit) out.push("Auditory Time Log");
  if (d.resMatrix) out.push("Decision & Habit Matrix");
  return out;
}

/* ================= portal database ================= */
let MODE = "connecting"; // "shared" | "local" | "readonly"
let DB = readDbBlock();
let openedVisit = null;  // {clientId, visitId, savedAt, clientName}
let artifactCapPromise = null;

function readDbBlock() {
  try {
    const parsed = JSON.parse(document.getElementById("db").textContent);
    if (parsed && Array.isArray(parsed.clients)) return parsed;
  } catch (e) { /* fall through */ }
  return { v: 1, clients: [] };
}
function readLocalMirror() {
  try {
    const parsed = JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || "null");
    if (parsed && Array.isArray(parsed.clients)) return parsed;
  } catch (e) { /* corrupt mirror */ }
  return null;
}
function getArtifactCap() {
  if (!artifactCapPromise) {
    artifactCapPromise = (window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("artifact")).catch(() => null)
      : Promise.resolve(null);
  }
  return artifactCapPromise;
}
function getDownloadsCap() {
  return (window.claude && typeof window.claude.use === "function")
    ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
    : Promise.resolve(null);
}

function findClient(db, rec) {
  if (rec.clientId) {
    const byId = db.clients.find(c => c.id === rec.clientId);
    if (byId) return byId;
  }
  const key = (rec.data.name || "").trim().toLowerCase();
  return key ? db.clients.find(c => (c.name || "").trim().toLowerCase() === key) : null;
}
function applyRecord(db, rec) {
  let client = findClient(db, rec);
  if (!client) {
    client = { id: genId("c"), name: rec.data.name.trim(), email: rec.data.email || "", visits: [] };
    db.clients.push(client);
  }
  client.name = rec.data.name.trim() || client.name;
  if (rec.data.email) client.email = rec.data.email;
  const existing = client.visits.find(v => v.id === rec.visitId);
  if (existing) {
    existing.data = rec.data; existing.savedAt = rec.savedAt; existing.savedBy = rec.savedBy;
  } else {
    client.visits.push({ id: rec.visitId, savedAt: rec.savedAt, savedBy: rec.savedBy, data: rec.data });
  }
  return client;
}
function visitExists(db, rec) {
  return db.clients.some(c => c.visits.some(v => v.id === rec.visitId &&
    (rec.op !== "update" || v.savedAt === rec.savedAt)));
}
function deleteVisit(db, clientId, visitId) {
  const client = db.clients.find(c => c.id === clientId);
  if (!client) return;
  client.visits = client.visits.filter(v => v.id !== visitId);
  if (!client.visits.length) db.clients = db.clients.filter(c => c.id !== clientId);
}
function mergeDb(db, incoming) {
  let added = 0;
  for (const inc of incoming.clients || []) {
    if (!inc || !Array.isArray(inc.visits)) continue;
    let client = db.clients.find(c => c.id === inc.id) ||
      db.clients.find(c => (c.name || "").trim().toLowerCase() === (inc.name || "").trim().toLowerCase());
    if (!client) {
      client = { id: inc.id || genId("c"), name: inc.name || "Unnamed", email: inc.email || "", visits: [] };
      db.clients.push(client);
    }
    for (const v of inc.visits) {
      if (v && v.id && !client.visits.some(x => x.id === v.id)) { client.visits.push(v); added++; }
    }
  }
  return added;
}

/* -------- persistence -------- */
function saveLocalMirror() {
  try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); return true; }
  catch (e) { toast("Could not save on this device (storage full?)"); return false; }
}
async function publishDb(pendingRec) {
  const cap = await getArtifactCap();
  if (!cap) { // local mode
    if (saveLocalMirror()) { toast("Saved on this device"); afterLocalSave(); }
    return;
  }
  if (pendingRec) sessionStorage.setItem(PENDING_KEY, JSON.stringify(pendingRec));
  try {
    await cap.publish(renderFullPage(DB));
    // success: the shell reloads every view including this one.
    toast("Saving…");
  } catch (e) {
    handlePublishError(e, pendingRec);
  }
}
function handlePublishError(e, pendingRec) {
  const code = e && e.code;
  if (code === "conflict") {
    // The shell reloads this view to the winning version; the pending
    // record is re-applied and re-published on load.
    toast("Someone else saved — syncing your record…");
  } else if (code === "not_writer" || code === "not_granted" || code === "consent_required" ||
             code === "capability_disabled" || code === "capability_removed") {
    sessionStorage.removeItem(PENDING_KEY);
    setReadOnly();
    toast("View-only access — ask the owner to share you as an editor");
  } else if (code === "rate_limited") {
    sessionStorage.removeItem(PENDING_KEY);
    toast("Saving too fast — wait a few seconds and try again");
  } else if (code === "too_large") {
    sessionStorage.removeItem(PENDING_KEY);
    toast("Portal is full — export a backup and delete old records");
  } else {
    // upstream_error or unknown: retry once via the pending mechanism
    const rec = pendingRec || null;
    if (rec && (rec.attempts || 0) < 1) {
      rec.attempts = (rec.attempts || 0) + 1;
      sessionStorage.setItem(PENDING_KEY, JSON.stringify(rec));
      setTimeout(() => { DB = readDbBlock(); applyRecord(DB, rec); publishDb(rec); }, 900 + Math.random() * 900);
      toast("Save hiccup — retrying…");
    } else {
      sessionStorage.removeItem(PENDING_KEY);
      toast("Save failed — your form is still filled in; try again");
    }
  }
}
function afterLocalSave() {
  renderRoster();
  updateSaveBar();
}

/* -------- self-reconstruction -------- */
function renderFullPage(db) {
  const css = document.getElementById("appcss").textContent;
  const js = document.getElementById("appjs").textContent;
  const json = JSON.stringify(db).replace(/</g, "\\u003c");
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>Momentum Email Builder</title>\n' +
    '<style id="appcss">' + css + '</style>\n</head>\n<body>\n' +
    '<script id="db" type="application/json">' + json + '<\/script>\n' +
    '<div id="root"></div>\n' +
    '<script id="appjs">' + js + '<\/script>\n' +
    '</body>\n</html>';
}

/* ================= save actions ================= */
function saveToPortal(op) {
  const d = collect();
  if (!d.name) { toast("Enter the client’s name before saving"); return; }
  const rec = {
    op,
    clientId: op === "update" && openedVisit ? openedVisit.clientId : (openedVisit ? openedVisit.clientId : null),
    visitId: op === "update" && openedVisit ? openedVisit.visitId : genId("v"),
    data: d,
    savedAt: new Date().toISOString(),
    savedBy: d.trainer || "",
    attempts: 0
  };
  DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
  const client = applyRecord(DB, rec);
  openedVisit = { clientId: client.id, visitId: rec.visitId, savedAt: rec.savedAt, clientName: client.name };
  publishDb(rec);
}

/* ================= mode / banner ================= */
function setMode(mode) {
  MODE = mode;
  const chip = document.getElementById("modeChip");
  const banner = document.getElementById("statusBanner");
  chip.classList.remove("shared", "local", "ro");
  if (mode === "shared") {
    chip.textContent = "Team Portal"; chip.classList.add("shared");
    banner.classList.remove("show");
  } else if (mode === "local") {
    chip.textContent = "This Device Only"; chip.classList.add("local");
    banner.innerHTML = "Running outside the team portal — records you save stay <b>on this device only</b>. Open the claude.ai link to save for the whole team.";
    banner.classList.add("show");
  } else if (mode === "readonly") {
    chip.textContent = "View Only"; chip.classList.add("ro");
    banner.innerHTML = "You have <b>view-only</b> access: you can browse clients and generate emails, but saves are off. Ask the page owner to share you as an editor.";
    banner.classList.add("show");
  }
  const ro = mode === "readonly";
  ["btnSavePortal", "btnSaveNewVisit", "btnImport"].forEach(id => { document.getElementById(id).disabled = ro; });
}
function setReadOnly() {
  try { sessionStorage.setItem("momentum-readonly", "1"); } catch (e) { /* ignore */ }
  setMode("readonly");
}

/* ================= views ================= */
function showView(which) {
  const roster = which === "roster";
  document.getElementById("rosterView").hidden = !roster;
  document.getElementById("builderView").hidden = roster;
  document.getElementById("navRoster").classList.toggle("on", roster);
  document.getElementById("navBuilder").classList.toggle("on", !roster);
  if (roster) renderRoster();
}

function updateSaveBar() {
  const msg = document.getElementById("saveMsg");
  const btnMain = document.getElementById("btnSavePortal");
  const btnNewV = document.getElementById("btnSaveNewVisit");
  if (openedVisit) {
    msg.innerHTML = "Editing <b>" + esc(openedVisit.clientName) + "</b> — visit saved " + esc(niceStamp(openedVisit.savedAt));
    btnMain.textContent = "Update Visit";
    btnNewV.hidden = false;
  } else if (draftHasContent()) {
    msg.innerHTML = "Unsaved draft — <b>" + esc(draftLabel()) + "</b> · not in the portal yet";
    btnMain.textContent = "Save to Portal";
    btnNewV.hidden = true;
  } else {
    msg.textContent = "New discovery record — not saved to the portal yet";
    btnMain.textContent = "Save to Portal";
    btnNewV.hidden = true;
  }
}

function clientCardHtml(c) {
  const visits = c.visits.slice().sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""));
  const last = visits[0];
  const lastTotal = last ? fmsTotal(last.data) : null;
  const vrows = visits.map(v => {
    const t = fmsTotal(v.data);
    return '<div class="vrow">' +
      '<div class="vinfo"><span class="vd">' + esc(niceStamp(v.savedAt)) + "</span>" +
      '<div class="vm">' + (v.savedBy ? "Trainer: " + esc(v.savedBy) + " · " : "") +
      (t !== null ? "FMS " + t + "/27 · " : "") +
      [v.data.goal1, v.data.goal2, v.data.goal3].filter(Boolean).length + " goals</div></div>" +
      '<button type="button" class="btn sm" data-act="open" data-cid="' + c.id + '" data-vid="' + v.id + '">Open</button>' +
      '<button type="button" class="btn sm danger" data-act="delvisit" data-cid="' + c.id + '" data-vid="' + v.id + '">Delete</button>' +
      "</div>";
  }).join("");
  return '<details class="ccard"><summary>' +
    '<span class="cname">' + esc(c.name) + "</span>" +
    '<span class="cmeta">' + (c.email ? esc(c.email) + " · " : "") +
    "<b>" + visits.length + "</b> visit" + (visits.length === 1 ? "" : "s") +
    (last ? " · last " + esc(niceStamp(last.savedAt)) : "") +
    (lastTotal !== null ? " · FMS <b>" + lastTotal + "/27</b>" : "") +
    '</span><span class="chev" style="margin-left:auto;color:var(--muted)">›</span></summary>' +
    '<div class="cbody2">' + vrows +
    '<div class="cfoot"><button type="button" class="btn sm danger" data-act="delclient" data-cid="' + c.id + '">Delete Client</button></div>' +
    "</div></details>";
}
function renderRoster() {
  const q = (document.getElementById("searchBox").value || "").trim().toLowerCase();
  const clients = DB.clients
    .filter(c => !q || (c.name || "").toLowerCase().includes(q) || (c.email || "").toLowerCase().includes(q))
    .sort((a, b) => {
      const la = a.visits.reduce((m, v) => v.savedAt > m ? v.savedAt : m, "");
      const lb = b.visits.reduce((m, v) => v.savedAt > m ? v.savedAt : m, "");
      return lb.localeCompare(la);
    });
  const totalVisits = DB.clients.reduce((n, c) => n + c.visits.length, 0);
  document.getElementById("rosterCount").textContent =
    DB.clients.length + " client" + (DB.clients.length === 1 ? "" : "s") + " · " + totalVisits + " saved visit" + (totalVisits === 1 ? "" : "s");
  document.getElementById("rosterList").innerHTML = clients.map(clientCardHtml).join("");
  document.getElementById("rosterEmpty").hidden = DB.clients.length > 0;
  renderDraftCard();
}
/* Surfaces an abandoned in-progress form so the next trainer on a shared
   computer sees it instead of silently wiping it. */
function renderDraftCard() {
  const host = document.getElementById("draftCard");
  if (!host) return;
  if (openedVisit || !draftHasContent()) { host.hidden = true; host.innerHTML = ""; return; }
  const d = collect();
  host.hidden = false;
  host.innerHTML =
    '<div class="dinfo"><div class="dtitle">Unsaved draft — ' + esc(draftLabel(d)) + "</div>" +
    '<div class="dmeta">' + (d.trainer ? "started by " + esc(d.trainer) + " · " : "") + "not saved to the portal</div></div>" +
    '<button type="button" class="btn sm" data-dact="resume">Resume</button>' +
    '<button type="button" class="btn sm danger" data-dact="discard">Discard</button>';
}

function openVisit(cid, vid) {
  const client = DB.clients.find(c => c.id === cid);
  const visit = client && client.visits.find(v => v.id === vid);
  if (!visit) { toast("Record not found"); return; }
  fillForm(visit.data);
  openedVisit = { clientId: client.id, visitId: visit.id, savedAt: visit.savedAt, clientName: client.name };
  updateSaveBar();
  showView("builder");
  refresh();
  window.scrollTo(0, 0);
}

/* ================= export / import ================= */
async function exportBackup() {
  const payload = JSON.stringify(DB, null, 2);
  const stamp = new Date().toISOString().slice(0, 10);
  const fname = "momentum-clients-" + stamp + ".json";
  const dl = await getDownloadsCap();
  if (dl) {
    try { await dl.save({ filename: fname, data: payload }); toast("Backup saved"); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      /* fall through to other methods */
    }
  }
  try {
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(payload);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Backup downloaded");
  } catch (e) {
    try { await navigator.clipboard.writeText(payload); toast("Backup copied to clipboard — paste into a file"); }
    catch (e2) { toast("Export failed"); }
  }
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try { incoming = JSON.parse(reader.result); } catch (e) { toast("That file isn’t a valid backup"); return; }
    if (!incoming || !Array.isArray(incoming.clients)) { toast("That file isn’t a Momentum backup"); return; }
    DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
    const added = mergeDb(DB, incoming);
    if (!added) { toast("Nothing new in that backup"); renderRoster(); return; }
    publishDb(null);
    if (MODE !== "local") toast("Merging " + added + " visit" + (added === 1 ? "" : "s") + "…");
  };
  reader.readAsText(file);
}

/* ================= email UI wiring ================= */
let format = "classic";
const preview = document.getElementById("preview");

function buildEmailHtml(purpose) {
  const d = collect();
  if (format === "classic") return renderClassic(d);
  return renderBranded(d, purpose === "copy" ? HOSTED_LOGO : LOGO_URI);
}
function updateGaps(d) {
  for (let i = 1; i <= 7; i++) {
    const ideal = +d["ffaIdeal" + i] || 0, self = +d["ffaSelf" + i] || 0;
    const el = document.getElementById("ffaGap" + i);
    if (ideal && self) el.textContent = ideal - self; else el.textContent = "–";
    el.classList.remove("hot");
  }
  const rows = [];
  for (let i = 1; i <= 7; i++) {
    const ideal = +d["ffaIdeal" + i] || 0, self = +d["ffaSelf" + i] || 0;
    if (d["ffaChar" + i] && ideal && self && ideal - self > 0) rows.push({ i, gap: ideal - self });
  }
  rows.sort((a, b) => b.gap - a.gap).slice(0, 3).forEach(r => document.getElementById("ffaGap" + r.i).classList.add("hot"));
}
function subjectLine(d) {
  const n = firstName(d.name);
  return (n ? n + ", your" : "Your") + " Momentum Roadmap | Post Discovery Meeting";
}
function refresh() {
  const d = collect();
  persistDraft(d);
  updateGaps(d);
  const total = fmsTotal(d);
  document.getElementById("fmsTotal").textContent = (total === null ? 0 : total) + " / 27";
  document.getElementById("toMeta").innerHTML = d.email
    ? "To: <b>" + esc(d.email) + "</b> · Subject: <b>" + esc(subjectLine(d)) + "</b>"
    : "Subject: <b>" + esc(subjectLine(d)) + "</b>";
  preview.innerHTML = buildEmailHtml("preview");
  preview.style.padding = format === "branded" ? "0" : "26px 28px";
  updateSaveBar();
}
function htmlToText(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("p,tr,div").forEach(el => el.append("\n"));
  return tmp.textContent.replace(/\n{3,}/g, "\n\n").trim();
}
async function copyPlainText(text) {
  if (!text) return false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) { /* frame denies the async clipboard — use the fallback below */ }
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
  document.body.appendChild(ta);
  let ok = false;
  try {
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand("copy");
  } catch (e) { ok = false; }
  ta.remove();
  return ok;
}
async function copyRich(html, plain) {
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([plain], { type: "text/plain" })
      })]);
      return true;
    } catch (e) { /* fall through */ }
  }
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(preview);
  sel.removeAllRanges(); sel.addRange(range);
  const ok = document.execCommand("copy");
  sel.removeAllRanges();
  return ok;
}

/* ================= event wiring ================= */
document.getElementById("btnCopy").addEventListener("click", async () => {
  const html = buildEmailHtml("copy");
  const ok = await copyRich(html, htmlToText(html));
  toast(ok ? "Email copied — paste into a Gmail compose window" : "Copy failed — select the preview and copy manually");
});
document.getElementById("btnSubject").addEventListener("click", async () => {
  const ok = await copyPlainText(subjectLine(collect()));
  toast(ok ? "Subject copied — paste into Gmail's subject line" : "Copy failed — select the subject above and copy manually");
});
document.getElementById("fmtClassic").addEventListener("click", () => {
  format = "classic";
  document.getElementById("fmtClassic").classList.add("on");
  document.getElementById("fmtBranded").classList.remove("on");
  refresh();
});
document.getElementById("fmtBranded").addEventListener("click", () => {
  format = "branded";
  document.getElementById("fmtBranded").classList.add("on");
  document.getElementById("fmtClassic").classList.remove("on");
  refresh();
});
document.getElementById("btnNew").addEventListener("click", async () => {
  if (!await confirmDiscardDraft()) return;
  discardDraft();
  showView("builder");
  toast("Form cleared");
});
document.getElementById("btnSavePortal").addEventListener("click", () => {
  saveToPortal(openedVisit ? "update" : "new");
});
document.getElementById("btnSaveNewVisit").addEventListener("click", () => {
  openedVisit = null; // fall through to a fresh visit for the same client
  saveToPortal("new");
});
document.getElementById("navRoster").addEventListener("click", () => showView("roster"));
document.getElementById("navBuilder").addEventListener("click", () => showView("builder"));
document.getElementById("btnNewRecord").addEventListener("click", async () => {
  if (!await confirmDiscardDraft()) return;
  discardDraft();
  showView("builder");
});
document.getElementById("draftCard").addEventListener("click", async e => {
  const btn = e.target.closest("[data-dact]");
  if (!btn) return;
  if (btn.dataset.dact === "resume") { showView("builder"); window.scrollTo(0, 0); return; }
  if (!await confirmDiscardDraft()) return;
  discardDraft();
  renderRoster();
  toast("Draft discarded");
});
document.getElementById("searchBox").addEventListener("input", renderRoster);
document.getElementById("btnExport").addEventListener("click", exportBackup);
document.getElementById("btnImport").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("rosterList").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  e.preventDefault();
  const { act, cid, vid } = btn.dataset;
  if (act === "open") { openVisit(cid, vid); return; }
  const client = DB.clients.find(c => c.id === cid);
  if (!client) { toast("That record is no longer here"); return; }
  if (act === "delvisit") {
    const visit = client.visits.find(v => v.id === vid);
    const ok = await askConfirm({
      title: "Delete this visit?",
      message: "The " + (visit ? niceStamp(visit.savedAt) + " " : "") + "visit for " + client.name +
        " will be removed for everyone. This cannot be undone — export a backup first if you are unsure.",
      confirmLabel: "Delete visit",
      danger: true
    });
    if (!ok) return;
    DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
    deleteVisit(DB, cid, vid);
    if (openedVisit && openedVisit.visitId === vid) { openedVisit = null; updateSaveBar(); }
    publishDb(null);
    if (MODE === "local") { renderRoster(); toast("Visit deleted"); }
  } else if (act === "delclient") {
    const n = client.visits.length;
    const ok = await askConfirm({
      title: "Delete " + client.name + "?",
      message: "All " + n + " saved visit" + (n === 1 ? "" : "s") + " for " + client.name +
        " will be removed for everyone. This cannot be undone — export a backup first if you are unsure.",
      confirmLabel: "Delete client",
      danger: true
    });
    if (!ok) return;
    DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
    DB.clients = DB.clients.filter(c => c.id !== cid);
    if (openedVisit && openedVisit.clientId === cid) { openedVisit = null; updateSaveBar(); }
    publishDb(null);
    if (MODE === "local") { renderRoster(); toast("Client deleted"); }
  }
});
document.querySelector('[data-key="trainer"]').addEventListener("change", e => {
  rememberTrainer(e.target.value.trim());
});
document.getElementById("form").addEventListener("input", refresh);
document.getElementById("form").addEventListener("change", refresh);
document.getElementById("form").addEventListener("submit", e => e.preventDefault());

/* ================= boot ================= */
restoreDraft();
const dateEl = document.querySelector('[data-key="date"]');
if (dateEl && !dateEl.value) dateEl.value = todayIso();
const trainerEl = document.querySelector('[data-key="trainer"]');
if (trainerEl && !trainerEl.value) trainerEl.value = rememberedTrainer();
updateSaveBar();
refresh();

getArtifactCap().then(cap => {
  let readonlyFlag = false;
  try { readonlyFlag = sessionStorage.getItem("momentum-readonly") === "1"; } catch (e) { /* ignore */ }
  if (!cap) {
    setMode("local");
    const mirror = readLocalMirror();
    if (mirror) DB = mirror;
  } else if (readonlyFlag) {
    setMode("readonly");
  } else {
    setMode("shared");
  }

  // finish any save that was in flight before the last reload
  let pending = null;
  try { pending = JSON.parse(sessionStorage.getItem(PENDING_KEY) || "null"); } catch (e) { /* ignore */ }
  if (pending && MODE === "shared") {
    if (visitExists(DB, pending)) {
      sessionStorage.removeItem(PENDING_KEY);
      const owner = DB.clients.find(c => c.visits.some(v => v.id === pending.visitId));
      if (owner) {
        const v = owner.visits.find(x => x.id === pending.visitId);
        openedVisit = { clientId: owner.id, visitId: v.id, savedAt: v.savedAt, clientName: owner.name };
        updateSaveBar();
      }
      toast("Saved to portal ✓");
      showView("roster");
    } else if ((pending.attempts || 0) < 2) {
      pending.attempts = (pending.attempts || 0) + 1;
      applyRecord(DB, pending);
      publishDb(pending);
      showView("roster");
    } else {
      sessionStorage.removeItem(PENDING_KEY);
      toast("Save didn’t stick — reopen the form draft and try again");
      showView("roster");
    }
  } else {
    if (pending && MODE !== "shared") { try { sessionStorage.removeItem(PENDING_KEY); } catch (e) { /* ignore */ } }
    showView(DB.clients.length ? "roster" : "builder");
  }
});
</script>
