<div class="wrap" id="app"></div>

<script>
"use strict";
const DB = JSON.parse(document.getElementById("adsdata").textContent || '{"v":1,"ads":[]}');
const app = document.getElementById("app");

const state = { range: "7d" };
const RANGE_LABELS = { "7d": "Last 7 days", "14d": "Last 14 days", "30d": "Last 30 days", "life": "Lifetime" };
const RANGE_DAYS = { "7d": 7, "14d": 14, "30d": 30, "life": 30 };

const CUR = (DB.account && DB.account.currency) || "USD";
const fmtMoney = new Intl.NumberFormat(undefined, { style: "currency", currency: CUR, maximumFractionDigits: 0 });
const fmtMoney2 = new Intl.NumberFormat(undefined, { style: "currency", currency: CUR, maximumFractionDigits: 2 });
const fmtInt = new Intl.NumberFormat();
const fmtCompact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
const money = v => fmtMoney.format(v || 0);
const money2 = v => v == null ? "—" : fmtMoney2.format(v);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------------------------------------------------- helpers */
function statusChip(status) {
  const s = String(status || "").toUpperCase();
  if (s === "ACTIVE") return '<span class="chip on"><i></i>Active</span>';
  if (s.includes("PAUSED")) return '<span class="chip off"><i></i>Paused</span>';
  if (s === "UNKNOWN" || s === "") return '<span class="chip off"><i></i>—</span>';
  return `<span class="chip issue"><i></i>${esc(s.toLowerCase().replace(/_/g, " "))}</span>`;
}

function tot(ad) { return (ad.totals && ad.totals[state.range]) || {}; }

function sumAds(ads) {
  const acc = { spend: 0, leads: 0, impressions: 0, reach: 0, clicks: 0 };
  for (const ad of ads) {
    const t = tot(ad);
    acc.spend += t.spend || 0; acc.leads += t.leads || 0;
    acc.impressions += t.impressions || 0; acc.reach += t.reach || 0;
    acc.clicks += t.clicks || 0;
  }
  acc.cpl = acc.leads ? acc.spend / acc.leads : null;
  return acc;
}

/* Daily series across all ads, windowed to the selected range. */
function accountDaily() {
  const byDate = new Map();
  for (const ad of DB.ads) for (const d of (ad.daily || [])) {
    const row = byDate.get(d.d) || { d: d.d, spend: 0, leads: 0 };
    row.spend += d.spend || 0; row.leads += d.leads || 0;
    byDate.set(d.d, row);
  }
  return [...byDate.values()].sort((a, b) => a.d < b.d ? -1 : 1);
}

function windowed(series, n) { return series.slice(-n); }

/* Delta vs the preceding window of equal length (needs 2n <= series). */
function delta(series, n, key) {
  if (series.length < n * 2) return null;
  const cur = series.slice(-n).reduce((s, r) => s + r[key], 0);
  const prev = series.slice(-n * 2, -n).reduce((s, r) => s + r[key], 0);
  if (!prev) return null;
  return (cur - prev) / prev * 100;
}

function deltaChip(pct, goodWhenUp) {
  if (pct == null || !isFinite(pct)) return "";
  const up = pct >= 0.5, down = pct <= -0.5;
  if (!up && !down) return '<span class="delta flat">≈ level</span>';
  const cls = up ? (goodWhenUp ? "up-good" : "up-bad") : (goodWhenUp ? "down-bad" : "down-good");
  return `<span class="delta ${cls}">${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%</span>`;
}

const dateShort = iso => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });

/* ------------------------------------------------------- svg charts */
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function niceMax(v) {
  if (v <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * pow) return m * pow;
  return 10 * pow;
}

/* One single-series chart panel: area (spend) or bars (leads). */
function chartPanel(series, key, kind, height, width, fmt) {
  const PAD = { l: 46, r: 10, t: 8, b: 20 };
  const w = Math.max(width, 320), h = height;
  const iw = w - PAD.l - PAD.r, ih = h - PAD.t - PAD.b;
  const max = niceMax(Math.max(...series.map(r => r[key]), 0.001));
  const x = i => PAD.l + (series.length === 1 ? iw / 2 : i * iw / (series.length - 1));
  const y = v => PAD.t + ih - (v / max) * ih;
  const svg = svgEl("svg", { width: w, height: h, viewBox: `0 0 ${w} ${h}`, role: "img" });

  for (const frac of [0, 0.5, 1]) {
    const gy = PAD.t + ih - frac * ih;
    svg.append(svgEl("line", { x1: PAD.l, x2: w - PAD.r, y1: gy, y2: gy,
      stroke: frac === 0 ? cssVar("--baseline") : cssVar("--grid"), "stroke-width": 1 }));
    const lbl = svgEl("text", { x: PAD.l - 7, y: gy + 4, "text-anchor": "end",
      "font-size": 10.5, fill: cssVar("--muted") });
    lbl.textContent = fmt(max * frac);
    svg.append(lbl);
  }
  const step = Math.max(1, Math.round(series.length / 5));
  series.forEach((r, i) => {
    if (i % step !== 0 && i !== series.length - 1) return;
    const t = svgEl("text", { x: x(i), y: h - 5, "text-anchor": "middle", "font-size": 10.5, fill: cssVar("--muted") });
    t.textContent = dateShort(r.d);
    svg.append(t);
  });

  const color = cssVar(key === "spend" ? "--spend" : "--leads");
  if (kind === "area") {
    const pts = series.map((r, i) => `${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`);
    svg.append(svgEl("path", { d: `M${PAD.l},${PAD.t + ih} L${pts.join(" L")} L${w - PAD.r},${PAD.t + ih} Z`,
      fill: cssVar("--spend-soft"), stroke: "none" }));
    svg.append(svgEl("path", { d: `M${pts.join(" L")}`, fill: "none", stroke: color,
      "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = series[series.length - 1];
    svg.append(svgEl("circle", { cx: x(series.length - 1), cy: y(last[key]), r: 3.5,
      fill: color, stroke: cssVar("--surface"), "stroke-width": 2 }));
  } else {
    const bw = Math.max(3, Math.min(18, iw / series.length - 2));
    series.forEach((r, i) => {
      const v = r[key];
      if (v <= 0) return;
      const by = y(v);
      svg.append(svgEl("rect", { x: x(i) - bw / 2, y: by, width: bw,
        height: PAD.t + ih - by, rx: Math.min(2, bw / 2), fill: color }));
    });
  }
  svg.append(svgEl("line", { class: "cross", x1: -9, x2: -9, y1: PAD.t, y2: PAD.t + ih,
    stroke: cssVar("--baseline"), "stroke-width": 1, "stroke-dasharray": "3 3" }));
  svg._geom = { x, PAD, w };
  return svg;
}

function sparkline(daily) {
  const w = 96, h = 34, pad = 3;
  const series = daily.length ? daily : [{ spend: 0 }];
  const max = Math.max(...series.map(r => r.spend), 0.001);
  const x = i => pad + (series.length === 1 ? (w - 2 * pad) / 2 : i * (w - 2 * pad) / (series.length - 1));
  const y = v => h - pad - (v / max) * (h - 2 * pad);
  const pts = series.map((r, i) => `${x(i).toFixed(1)},${y(r.spend).toFixed(1)}`);
  const last = series[series.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily spend, last 30 days">
    <path d="M${pad},${h - pad} L${pts.join(" L")} L${x(series.length - 1)},${h - pad} Z" fill="var(--spend-soft)"/>
    <path d="M${pts.join(" L")}" fill="none" stroke="var(--spend)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${x(series.length - 1)}" cy="${y(last.spend)}" r="2.5" fill="var(--spend)"/>
  </svg>`;
}

/* ------------------------------------------------------------ render */
function render() {
  if (!DB.ads || !DB.ads.length) {
    app.innerHTML = `
      <header class="top"><div class="wordmark">Momentum <b>Ad Pulse</b></div></header>
      <div class="card empty">
        <div class="display">No ad data baked in yet</div>
        <p>This is the empty template. Run <code>python3 fetch_ads.py</code> (or
        <code>--sample</code>) in <code>facebook-ads-dashboard/</code>, then publish
        <code>data/dashboard.html</code>.</p>
      </div>`;
    return;
  }

  const ads = DB.ads;
  const acct = sumAds(ads);
  const daily = accountDaily();
  const n = RANGE_DAYS[state.range];
  const win = windowed(daily, n);
  const showDelta = state.range === "7d" || state.range === "14d";
  const links = DB.links || {};

  const campMap = new Map();
  for (const ad of ads) {
    const c = ad.campaign || { id: "?", name: "(no campaign)" };
    if (!campMap.has(c.id)) campMap.set(c.id, { camp: c, ads: [] });
    campMap.get(c.id).ads.push(ad);
  }
  const campaigns = [...campMap.values()]
    .sort((a, b) => sumAds(b.ads).spend - sumAds(a.ads).spend);
  for (const g of campaigns) g.ads.sort((a, b) => (tot(b).spend || 0) - (tot(a).spend || 0));

  app.innerHTML = `
    <header class="top">
      <div class="wordmark">Momentum <b>Ad Pulse</b></div>
      <div class="acct">${esc(DB.account && DB.account.name || "")}</div>
      ${DB.sample ? '<span class="badge-sample">SAMPLE DATA</span>' : ""}
      <div class="asof">Data as of ${esc((DB.fetched_at || "").replace("T", " ").slice(0, 16))}</div>
    </header>

    <div class="controls">
      <span class="label">Range</span>
      <div class="seg" role="group" aria-label="Date range">
        ${Object.keys(RANGE_LABELS).map(r =>
          `<button aria-pressed="${r === state.range}" data-range="${r}">${RANGE_LABELS[r].replace("Last ", "")}</button>`).join("")}
      </div>
      <div class="quicklinks" style="margin-left:auto">
        ${links.ads_manager ? `<a href="${esc(links.ads_manager)}" target="_blank" rel="noopener">Ads Manager <span class="ext">↗</span></a>` : ""}
        ${links.leads_center ? `<a href="${esc(links.leads_center)}" target="_blank" rel="noopener">Leads Center <span class="ext">↗</span></a>` : ""}
        ${links.gohighlevel ? `<a href="${esc(links.gohighlevel)}" target="_blank" rel="noopener">GoHighLevel <span class="ext">↗</span></a>` : ""}
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">Spend · ${esc(RANGE_LABELS[state.range])}</div>
        <div class="v">${money(acct.spend)}</div>
        <div class="sub">${showDelta ? deltaChip(delta(daily, n, "spend"), null) + " vs prior " + n + " days" : fmtInt.format(acct.clicks) + " link clicks"}</div></div>
      <div class="tile"><div class="k">Leads</div>
        <div class="v">${fmtInt.format(acct.leads)}</div>
        <div class="sub">${showDelta ? deltaChip(delta(daily, n, "leads"), true) + " vs prior " + n + " days" : "all sources"}</div></div>
      <div class="tile"><div class="k">Cost per lead</div>
        <div class="v">${money2(acct.cpl)}</div>
        <div class="sub">${acct.leads ? money(acct.spend) + " ÷ " + fmtInt.format(acct.leads) + " leads" : "no leads in range"}</div></div>
      <div class="tile"><div class="k">Reach</div>
        <div class="v">${fmtCompact.format(acct.reach)}</div>
        <div class="sub">${fmtCompact.format(acct.impressions)} impressions</div></div>
    </div>

    <div class="card">
      <h2>Daily trend</h2>
      <div class="h-sub">
        <span class="serieskey"><i style="background:var(--spend)"></i>Spend</span>
        <span class="serieskey"><i style="background:var(--leads)"></i>Leads</span>
        ${state.range === "life" ? "showing the last 30 days (daily data window)" : esc(RANGE_LABELS[state.range].toLowerCase())}
      </div>
      <div class="trend" id="trend"><div class="tooltip" id="tt"></div></div>
    </div>

    ${campaigns.map(g => campaignCard(g)).join("")}

    <footer>Momentum Ad Pulse · read-only dashboard · numbers from the Meta Marketing API ·
      data as of ${esc((DB.fetched_at || "").slice(0, 10))}${DB.sample ? " · SAMPLE DATA" : ""}</footer>
  `;

  drawTrend(win);

  app.querySelectorAll(".seg button").forEach(b =>
    b.addEventListener("click", () => { state.range = b.dataset.range; render(); }));
}

/* Two stacked single-axis panels sharing one x-axis + one hover layer. */
function drawTrend(win) {
  const holder = document.getElementById("trend");
  const tt = document.getElementById("tt");
  const width = holder.clientWidth || 800;
  const spendSvg = chartPanel(win, "spend", "area", 150, width, v => money(v));
  const leadsSvg = chartPanel(win, "leads", "bars", 110, width, v => fmtInt.format(Math.round(v)));
  holder.append(spendSvg, leadsSvg);

  const geom = spendSvg._geom;
  function onMove(ev) {
    if (!win.length) return;
    const rect = holder.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    let best = 0, bestDist = Infinity;
    win.forEach((r, i) => {
      const d = Math.abs(geom.x(i) - px);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    const r = win[best];
    for (const svg of [spendSvg, leadsSvg]) {
      const c = svg.querySelector(".cross");
      c.setAttribute("x1", geom.x(best)); c.setAttribute("x2", geom.x(best));
    }
    tt.innerHTML = `<div class="tt-d">${dateShort(r.d)}</div>
      <div class="row"><i style="background:var(--spend)"></i>Spend<span class="num">${money2(r.spend)}</span></div>
      <div class="row"><i style="background:var(--leads)"></i>Leads<span class="num">${fmtInt.format(r.leads)}</span></div>`;
    tt.style.display = "block";
    const ttw = tt.offsetWidth;
    const lx = geom.x(best) + 12 + ttw > width ? geom.x(best) - ttw - 12 : geom.x(best) + 12;
    tt.style.left = lx + "px";
    tt.style.top = (ev.clientY - rect.top + 8) + "px";
  }
  function onLeave() {
    tt.style.display = "none";
    for (const svg of [spendSvg, leadsSvg]) {
      const c = svg.querySelector(".cross");
      c.setAttribute("x1", -9); c.setAttribute("x2", -9);
    }
  }
  holder.addEventListener("mousemove", onMove);
  holder.addEventListener("mouseleave", onLeave);
}

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(render, 150);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
