<style id="appcss">
  :root{
    --gold:#B2963D; --gold-2:#D6BD5E; --gold-deep:#8F7830;
    --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EFECE3;
    --ink:#1C1A15; --muted:#79787E; --line:#E3DFD3;
    --bar:#121212; --bar-ink:#F5F2EA;
    --focus:#B2963D; --danger:#B4443C; --ok:#38761d;
    --shadow:0 1px 2px rgba(28,26,21,.06),0 8px 24px -12px rgba(28,26,21,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161411; --surface:#1F1D19; --surface-2:#26231E;
      --ink:#ECE8DE; --muted:#A9A8AD; --line:#33302A;
      --bar:#0E0D0B; --bar-ink:#F5F2EA;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161411; --surface:#1F1D19; --surface-2:#26231E;
    --ink:#ECE8DE; --muted:#A9A8AD; --line:#33302A;
    --bar:#0E0D0B; --bar-ink:#F5F2EA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Raleway","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    font-size:15px; line-height:1.45;
  }
  h1,h2,h3,.hd{font-family:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif}

  .bar{
    position:sticky; top:0; z-index:40;
    background:var(--bar); color:var(--bar-ink);
    display:flex; align-items:center; gap:16px;
    padding:10px 20px; border-bottom:2px solid var(--gold);
  }
  .bar img{height:34px; width:auto; display:block}
  .bar .apptitle{
    font-family:"Poppins",system-ui,sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase; color:var(--gold-2);
    border-left:1px solid rgba(255,255,255,.25); padding-left:16px;
  }
  .bar .spacer{flex:1}
  .btn{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:13px;
    border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink);
    padding:8px 14px; cursor:pointer;
  }
  .btn:hover{border-color:var(--gold)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--focus); outline-offset:1px;
  }
  .btn.gold{background:var(--gold); border-color:var(--gold); color:#171308}
  .btn.gold:hover{background:var(--gold-2); border-color:var(--gold-2)}
  .btn.ghostbar{background:transparent; color:var(--bar-ink); border-color:rgba(255,255,255,.3)}
  .btn.ghostbar:hover{border-color:var(--gold-2); color:var(--gold-2)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger)}
  .btn.sm{padding:5px 10px; font-size:12px}
  .btn.solid-danger{background:var(--danger); border-color:var(--danger); color:#fff}
  .btn.solid-danger:hover{background:#9c3a33; border-color:#9c3a33}

  .chip{
    font-family:"Poppins",system-ui,sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.06em; border-radius:999px; padding:4px 12px;
    border:1px solid rgba(255,255,255,.3); color:var(--bar-ink); white-space:nowrap;
  }
  .chip::before{content:"● "; font-size:9px; vertical-align:1px}
  .chip.shared{border-color:#4c8c3f; color:#9CD08B}
  .chip.local{border-color:var(--gold-2); color:var(--gold-2)}
  .chip.ro{border-color:#c9803a; color:#E8B378}

  #statusBanner{
    display:none; padding:9px 20px; font-size:13.5px;
    background:color-mix(in srgb, var(--gold) 14%, var(--surface));
    border-bottom:1px solid color-mix(in srgb, var(--gold) 40%, var(--surface));
  }
  #statusBanner.show{display:block}

  .wrap{max-width:860px; margin:0 auto; padding:22px; display:flex; flex-direction:column; gap:16px}

  /* ---------- home ---------- */
  .welcome{
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--gold);
    border-radius:10px; box-shadow:var(--shadow); padding:18px 20px;
  }
  .welcome h1{margin:0 0 8px; font-size:19px; font-weight:600}
  .welcome p{margin:6px 0; color:var(--muted); font-size:14.5px}
  .welcome p b{color:var(--ink); font-weight:600}
  .rolegrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
  @media (max-width:620px){ .rolegrid{grid-template-columns:minmax(0,1fr)} }
  .rolecard{
    text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:18px; cursor:pointer; font:inherit; color:var(--ink);
    display:flex; flex-direction:column; gap:6px; transition:border-color .12s ease;
  }
  .rolecard:hover{border-color:var(--gold)}
  .rc-title{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:16px}
  .rc-meta{
    font-family:"Poppins",system-ui,sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--gold-deep);
  }
  :root[data-theme="dark"] .rc-meta{color:var(--gold-2)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rc-meta{color:var(--gold-2)} }
  .rc-blurb{font-size:13.5px; color:var(--muted)}
  .homefoot{display:flex; justify-content:center; padding:6px 0 20px}
  .linky{
    background:none; border:0; padding:6px 10px; cursor:pointer; font:inherit; font-size:12.5px;
    color:var(--muted); text-decoration:underline; text-underline-offset:3px;
  }
  .linky:hover{color:var(--gold-deep)}

  .draftcard{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line);
    border-left:4px solid var(--gold); border-radius:10px;
    box-shadow:var(--shadow); padding:13px 16px;
  }
  .draftcard .dinfo{flex:1; min-width:180px}
  .draftcard .dtitle{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:14.5px}
  .draftcard .dmeta{font-size:12.5px; color:var(--muted); margin-top:2px}

  /* ---------- questionnaire ---------- */
  .qtop{
    position:sticky; top:56px; z-index:30;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:12px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .qtop .qmsg{font-size:13.5px; color:var(--muted); flex:1; min-width:150px}
  .qtop .qmsg b{color:var(--ink); font-weight:600}
  .namef{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:4px;
  }
  details.card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  details.card > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px;
    padding:13px 16px; user-select:none;
  }
  details.card > summary::-webkit-details-marker{display:none}
  .num{
    font-family:"Poppins",system-ui,sans-serif; font-weight:700; font-size:12px;
    color:var(--gold-deep); background:color-mix(in srgb, var(--gold) 16%, var(--surface));
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--surface));
    border-radius:5px; padding:2px 7px; letter-spacing:.06em;
  }
  :root[data-theme="dark"] .num{color:var(--gold-2)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .num{color:var(--gold-2)} }
  summary .st{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:13.5px;
    letter-spacing:.12em; text-transform:uppercase;
  }
  summary .sdone{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap}
  summary .chev{color:var(--muted); transition:transform .15s ease}
  details[open] > summary .chev{transform:rotate(90deg)}
  @media (prefers-reduced-motion: reduce){ summary .chev{transition:none} }
  .cbody{padding:4px 16px 16px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:16px}
  .q{display:flex; flex-direction:column; gap:6px}
  .qlbl{font-size:14.5px; font-weight:600}
  .qhint{font-size:12.5px; color:var(--muted)}
  .lbl{
    font-family:"Poppins",system-ui,sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  }
  input[type=text],input[type=password],textarea{
    font:inherit; color:var(--ink); background:var(--bg);
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%;
  }
  textarea{resize:vertical; min-height:72px}
  input::placeholder,textarea::placeholder{color:color-mix(in srgb, var(--muted) 72%, var(--bg))}

  .ratingrow{display:flex; gap:8px; align-items:center}
  .ratebtn{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:14px;
    width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer;
  }
  .ratebtn:hover{border-color:var(--gold)}
  .ratebtn.on{background:var(--gold); border-color:var(--gold); color:#171308}
  .ratelabels{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); max-width:242px}
  .opts{display:flex; flex-direction:column; gap:8px}
  .optbtn{
    text-align:left; font:inherit; font-size:14px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; cursor:pointer;
  }
  .optbtn:hover{border-color:var(--gold)}
  .optbtn.on{background:color-mix(in srgb, var(--gold) 18%, var(--bg)); border-color:var(--gold); font-weight:600}

  /* ---------- done ---------- */
  .doneCard{
    text-align:center; background:var(--surface); border:1px solid var(--line);
    border-top:4px solid var(--gold); border-radius:12px; box-shadow:var(--shadow);
    padding:44px 24px; display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  .doneCard .big{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:20px}
  .doneCard p{margin:0; color:var(--muted); max-width:460px}

  /* ---------- review ---------- */
  .rtools{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .rhead{
    font-family:"Poppins",system-ui,sans-serif; font-size:13.5px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  }
  .ccard{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
  .ccard > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:14px; padding:14px 16px; user-select:none; flex-wrap:wrap}
  .ccard > summary::-webkit-details-marker{display:none}
  .cname{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:15.5px}
  .cmeta{font-size:12.5px; color:var(--muted)}
  .cmeta b{color:var(--ink); font-weight:600}
  .ccard .cbody2{border-top:1px solid var(--line); padding:12px 16px 14px}
  .anssec{
    font-family:"Poppins",system-ui,sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);
    margin:14px 0 4px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .anssec:first-child{margin-top:0; padding-top:0; border-top:0}
  :root[data-theme="dark"] .anssec{color:var(--gold-2)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .anssec{color:var(--gold-2)} }
  .ansq{font-size:13px; color:var(--muted); margin-top:10px}
  .ansa{font-size:14.5px; white-space:pre-wrap; margin-top:2px}
  .cfoot{display:flex; justify-content:flex-end; padding-top:12px}
  .empty{
    text-align:center; color:var(--muted); padding:44px 20px;
    background:var(--surface); border:1px dashed var(--line); border-radius:10px;
  }
  .pinbox{
    max-width:340px; margin:40px auto; background:var(--surface); border:1px solid var(--line);
    border-top:4px solid var(--gold); border-radius:12px; box-shadow:var(--shadow);
    padding:24px; display:flex; flex-direction:column; gap:12px;
  }
  .pinbox .mtitle{font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:16px}

  .modalback{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center;
    background:rgba(12,11,9,.55); padding:20px;
  }
  .modal{
    background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-top:4px solid var(--gold); border-radius:12px; box-shadow:0 24px 60px -20px rgba(0,0,0,.55);
    max-width:440px; width:100%; padding:22px 24px;
  }
  .modal .mtitle{
    font-family:"Poppins",system-ui,sans-serif; font-weight:600; font-size:17px; margin-bottom:8px;
  }
  .modal .mbody{font-size:14.5px; color:var(--muted); line-height:1.5; white-space:pre-line}
  .modal .mactions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px}
  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--bar); color:var(--bar-ink); border:1px solid var(--gold);
    border-radius:8px; padding:10px 18px; font-family:"Poppins",system-ui,sans-serif;
    font-size:13.5px; font-weight:600; opacity:0; transition:all .25s ease; z-index:60;
    pointer-events:none; max-width:88vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){ #toast{transition:opacity .1s linear} }
  @media (max-width:720px){
    .bar{gap:10px; padding:10px 14px; flex-wrap:wrap}
    .bar img{height:26px}
    .bar .apptitle{display:none}
    .qtop{top:0}
  }
</style>

/* ================= helpers ================= */
function esc(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function genId(prefix) {
  let core;
  try { core = crypto.randomUUID().slice(0, 8); }
  catch (e) { core = Math.random().toString(36).slice(2, 10); }
  return prefix + "_" + core;
}
function niceStamp(iso) {
  const dt = new Date(iso);
  if (isNaN(dt)) return "";
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
    " " + dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}
/* The published page runs in a sandboxed frame where window.confirm() is
   ignored and returns false, so every confirmation uses this in-page dialog. */
function askConfirm(opts) {
  return new Promise(resolve => {
    const back = document.getElementById("modalBack");
    const ok = document.getElementById("modalOk");
    const cancel = document.getElementById("modalCancel");
    document.getElementById("modalTitle").textContent = opts.title || "Are you sure?";
    document.getElementById("modalBody").textContent = opts.message || "";
    ok.textContent = opts.confirmLabel || "Confirm";
    ok.classList.toggle("solid-danger", !!opts.danger);
    ok.classList.toggle("gold", !opts.danger);
    cancel.textContent = opts.cancelLabel || "Cancel";
    back.hidden = false;
    const prev = document.activeElement;
    ok.focus();
    function done(val) {
      back.hidden = true;
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      back.removeEventListener("mousedown", onBack);
      document.removeEventListener("keydown", onKey, true);
      if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* gone */ } }
      resolve(val);
    }
    function onOk() { done(true); }
    function onCancel() { done(false); }
    function onBack(e) { if (e.target === back) done(false); }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); done(false); }
      else if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); done(true); }
      else if (e.key === "Tab") {
        e.preventDefault();
        (document.activeElement === ok ? cancel : ok).focus();
      }
    }
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    back.addEventListener("mousedown", onBack);
    document.addEventListener("keydown", onKey, true);
  });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ================= question-set helpers ================= */
function sectionsFor(role) { return QUESTION_SETS[role] || []; }
function questionsFor(role) {
  return sectionsFor(role).reduce((acc, s) => acc.concat(s.questions), []);
}
function findQuestion(qid) {
  for (const role of Object.keys(QUESTION_SETS)) {
    for (const sec of QUESTION_SETS[role]) {
      const q = sec.questions.find(x => x.id === qid);
      if (q) return { q, section: sec, role };
    }
  }
  return null;
}
function roleLabel(role) { return ROLES[role] ? ROLES[role].label : role; }

/* ================= draft (in-progress questionnaire) ================= */
/* Everyone answers on the shared front-desk computer, so an in-progress
   questionnaire is mirrored to localStorage and surfaced on the home screen
   instead of being silently wiped by the next person. */
let DRAFT = null; // { role, name, startedAt, answers: {qid: value} }

function persistDraft() {
  if (!DRAFT) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DRAFT)); } catch (e) { /* storage full/blocked */ }
}
function readDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (d && d.role && ROLES[d.role] && d.answers) return d;
  } catch (e) { /* corrupt draft */ }
  return null;
}
function clearDraft() {
  DRAFT = null;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
}
function answeredCount(d) {
  if (!d) return 0;
  return questionsFor(d.role).filter(q => {
    const v = d.answers[q.id];
    return v !== undefined && v !== null && String(v).trim() !== "";
  }).length;
}
function draftHasContent(d) {
  const x = d || DRAFT;
  return !!x && (answeredCount(x) > 0 || (x.name || "").trim() !== "");
}

/* ================= response database ================= */
let MODE = "connecting"; // "shared" | "local" | "readonly"
let DB = readDbBlock();
let artifactCapPromise = null;

function readDbBlock() {
  try {
    const parsed = JSON.parse(document.getElementById("db").textContent);
    if (parsed && Array.isArray(parsed.responses)) return parsed;
  } catch (e) { /* fall through */ }
  return { v: 1, responses: [] };
}
function readLocalMirror() {
  try {
    const parsed = JSON.parse(localStorage.getItem(LOCAL_DB_KEY) || "null");
    if (parsed && Array.isArray(parsed.responses)) return parsed;
  } catch (e) { /* corrupt mirror */ }
  return null;
}
function getArtifactCap() {
  if (!artifactCapPromise) {
    artifactCapPromise = (window.claude && typeof window.claude.use === "function")
      ? Promise.resolve(window.claude.use("artifact")).catch(() => null)
      : Promise.resolve(null);
  }
  return artifactCapPromise;
}
function getDownloadsCap() {
  return (window.claude && typeof window.claude.use === "function")
    ? Promise.resolve(window.claude.use("downloads")).catch(() => null)
    : Promise.resolve(null);
}

function applyResponse(db, rec) {
  const i = db.responses.findIndex(r => r.id === rec.id);
  const clean = {
    id: rec.id, role: rec.role, name: rec.name || "",
    startedAt: rec.startedAt, submittedAt: rec.submittedAt,
    questionsVersion: rec.questionsVersion, answers: rec.answers
  };
  if (i >= 0) db.responses[i] = clean; else db.responses.push(clean);
}
function responseExists(db, rec) {
  return db.responses.some(r => r.id === rec.id);
}
function mergeResponses(db, incoming) {
  let added = 0;
  for (const r of incoming.responses || []) {
    if (r && r.id && r.answers && !db.responses.some(x => x.id === r.id)) {
      db.responses.push(r); added++;
    }
  }
  return added;
}

/* -------- persistence -------- */
function saveLocalMirror() {
  try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(DB)); return true; }
  catch (e) { toast("Could not save on this device (storage full?)"); return false; }
}
async function publishDb(pendingRec) {
  const cap = await getArtifactCap();
  if (!cap) { // local mode
    if (saveLocalMirror()) {
      if (pendingRec) { clearDraft(); showView("done"); }
      else renderReview();
      toast("Saved on this device");
    }
    return;
  }
  if (pendingRec) sessionStorage.setItem(PENDING_KEY, JSON.stringify(pendingRec));
  try {
    await cap.publish(renderFullPage(DB));
    // success: the shell reloads every view including this one.
    toast("Saving…");
  } catch (e) {
    handlePublishError(e, pendingRec);
  }
}
function handlePublishError(e, pendingRec) {
  const code = e && e.code;
  if (code === "conflict") {
    // The shell reloads this view to the winning version; the pending
    // record is re-applied and re-published on load.
    toast("Someone else saved — syncing your answers…");
  } else if (code === "not_writer" || code === "not_granted" || code === "consent_required" ||
             code === "capability_disabled" || code === "capability_removed") {
    sessionStorage.removeItem(PENDING_KEY);
    setReadOnly();
    toast("View-only access — ask the owner to share you as an editor");
  } else if (code === "rate_limited") {
    sessionStorage.removeItem(PENDING_KEY);
    toast("Saving too fast — wait a few seconds and try again");
  } else if (code === "too_large") {
    sessionStorage.removeItem(PENDING_KEY);
    toast("Storage is full — export a backup and delete old responses");
  } else {
    // upstream_error or unknown: retry once via the pending mechanism
    const rec = pendingRec || null;
    if (rec && (rec.attempts || 0) < 1) {
      rec.attempts = (rec.attempts || 0) + 1;
      sessionStorage.setItem(PENDING_KEY, JSON.stringify(rec));
      setTimeout(() => { DB = readDbBlock(); applyResponse(DB, rec); publishDb(rec); }, 900 + Math.random() * 900);
      toast("Save hiccup — retrying…");
    } else {
      sessionStorage.removeItem(PENDING_KEY);
      toast("Save failed — your answers are still on screen; try again");
    }
  }
}

/* -------- self-reconstruction -------- */

    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>Momentum Staff Questionnaire</title>\n' +
    '<style id="appcss">' + css + '</style>\n</head>\n<body>\n' +
    '<script id="db" type="application/json">' + json + '<\/script>\n' +
    '<div id="root"></div>\n' +
    '<script id="appjs">' + js + '<\/script>\n' +
    '</body>\n</html>';
}

function setMode(mode) {
  MODE = mode;
  const chip = document.getElementById("modeChip");
  const banner = document.getElementById("statusBanner");
  chip.classList.remove("shared", "local", "ro");

    banner.classList.remove("show");
  } else if (mode === "local") {
    chip.textContent = "This Device Only"; chip.classList.add("local");

  document.getElementById("btnSubmit").disabled = ro;
  document.getElementById("btnImport").disabled = ro;

/* ---------- questionnaire ---------- */
function startQuestionnaire(role) {
  DRAFT = { role, name: "", startedAt: new Date().toISOString(), answers: {} };
  persistDraft();
  renderForm();
  showView("form");
}
function resumeQuestionnaire() {
  DRAFT = readDraft();
  if (!DRAFT) { showView("home"); return; }
  renderForm();
  showView("form");
}
function questionHtml(q) {
  const hint = q.hint ? '<div class="qhint">' + esc(q.hint) + '</div>' : '';
  let control = '';
  if (q.type === "rating") {
    let btns = '';
    for (let v = q.min || 1; v <= (q.max || 5); v++) {
      btns += '<button type="button" class="ratebtn" data-qid="' + q.id + '" data-val="' + v + '">' + v + '</button>';
    }
    control = '<div class="ratingrow">' + btns + '</div>' +
      '<div class="ratelabels"><span>' + esc(q.minLabel || '') + '</span><span>' + esc(q.maxLabel || '') + '</span></div>';
  } else if (q.type === "choice") {
    control = '<div class="opts">' + q.options.map(opt =>
      '<button type="button" class="optbtn" data-qid="' + q.id + '" data-val="' + esc(opt) + '">' + esc(opt) + '</button>'
    ).join("") + '</div>';
  } else {
    control = '<textarea id="q-' + q.id + '" data-qid="' + q.id + '" placeholder="' + esc(q.placeholder || 'Type your answer…') + '"></textarea>';
  }
  return '<div class="q">' +
    '<label class="qlbl" for="q-' + q.id + '">' + esc(q.label) + '</label>' + hint + control + '</div>';
}
function renderForm() {
  const secs = sectionsFor(DRAFT.role);
  document.getElementById("qForm").innerHTML = secs.map((sec, i) =>
    '<details class="card"' + (i === 0 ? ' open' : '') + ' data-sec="' + sec.id + '">' +
    '<summary><span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="st">' + esc(sec.title) + '</span>' +
    '<span class="sdone" data-secdone="' + sec.id + '"></span>' +
    '<span class="chev">›</span></summary>' +
    '<div class="cbody">' + sec.questions.map(questionHtml).join("") + '</div>' +
    '</details>'
  ).join("");
  document.getElementById("nameBox").value = DRAFT.name || "";
  // restore saved answers into the controls
  for (const q of questionsFor(DRAFT.role)) {
    const v = DRAFT.answers[q.id];
    if (v === undefined || v === null || v === "") continue;
    if (q.type === "text") {
      const ta = document.querySelector('#qForm textarea[data-qid="' + q.id + '"]');
      if (ta) ta.value = v;
    } else {
      document.querySelectorAll('#qForm [data-qid="' + q.id + '"]').forEach(btn => {
        btn.classList.toggle("on", String(btn.dataset.val) === String(v));
      });
    }
  }
  updateProgress();
}
function updateProgress() {
  const total = questionsFor(DRAFT.role).length;
  const done = answeredCount(DRAFT);
  document.getElementById("qProgress").innerHTML =
    "<b>" + esc(roleLabel(DRAFT.role)) + "</b> · " + done + " of " + total + " answered";
  for (const sec of sectionsFor(DRAFT.role)) {
    const el = document.querySelector('[data-secdone="' + sec.id + '"]');
    if (!el) continue;
    const n = sec.questions.filter(q => {
      const v = DRAFT.answers[q.id];
      return v !== undefined && v !== null && String(v).trim() !== "";
    }).length;
    el.textContent = n + "/" + sec.questions.length;
  }
}
function setAnswer(qid, val) {
  if (val === undefined || val === null || String(val).trim() === "") delete DRAFT.answers[qid];
  else DRAFT.answers[qid] = val;
  persistDraft();
  updateProgress();
}

async function submitAnswers() {
  if (MODE === "readonly") { toast("View-only access — submissions are off"); return; }
  const total = questionsFor(DRAFT.role).length;
  const done = answeredCount(DRAFT);
  if (done === 0) { toast("Answer at least one question before submitting"); return; }
  const skipped = total - done;
  const ok = await askConfirm({
    title: "Submit your answers?",
    message: "You answered " + done + " of " + total + " questions" +
      (skipped ? " (" + skipped + " skipped — that's fine)" : "") +
      ".\nOnce submitted, your answers go to the COO and this form clears for the next person.",
    confirmLabel: "Submit"
  });
  if (!ok) return;
  const rec = {
    id: genId("r"),
    role: DRAFT.role,
    name: (DRAFT.name || "").trim(),
    startedAt: DRAFT.startedAt,
    submittedAt: new Date().toISOString(),
    questionsVersion: QUESTIONS_VERSION,
    answers: DRAFT.answers,
    attempts: 0
  };
  DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
  applyResponse(DB, rec);
  publishDb(rec);
}

/* ---------- review ---------- */
function reviewUnlocked() {
  try { return sessionStorage.getItem(REVIEW_OK_KEY) === "1"; } catch (e) { return false; }
}
function responseCardHtml(r) {
  const secs = sectionsFor(r.role);
  const rendered = new Set();
  let body = "";
  for (const sec of secs) {
    const qa = sec.questions
      .filter(q => r.answers[q.id] !== undefined && String(r.answers[q.id]).trim() !== "")
      .map(q => {
        rendered.add(q.id);
        return '<div class="ansq">' + esc(q.label) + '</div><div class="ansa">' + esc(String(r.answers[q.id])) + '</div>';
      }).join("");
    if (qa) body += '<div class="anssec">' + esc(sec.title) + '</div>' + qa;
  }
  // answers whose question id was retired from the current set — show them raw
  const orphans = Object.keys(r.answers).filter(k => !rendered.has(k) && String(r.answers[k]).trim() !== "");
  if (orphans.length) {
    body += '<div class="anssec">Other (from an older question set)</div>' + orphans.map(k =>
      '<div class="ansq">' + esc(k) + '</div><div class="ansa">' + esc(String(r.answers[k])) + '</div>').join("");
  }
  const nAns = Object.keys(r.answers).length;
  return '<details class="ccard"><summary>' +
    '<span class="cname">' + esc(r.name || "Name not given") + '</span>' +
    '<span class="cmeta"><b>' + esc(roleLabel(r.role)) + '</b> · ' + nAns + ' answer' + (nAns === 1 ? '' : 's') +
    ' · ' + esc(niceStamp(r.submittedAt)) + '</span>' +
    '<span class="chev" style="margin-left:auto;color:var(--muted)">›</span></summary>' +
    '<div class="cbody2">' + body +
    '<div class="cfoot"><button type="button" class="btn sm danger" data-act="del" data-rid="' + r.id + '">Delete Response</button></div>' +
    '</div></details>';
}
function renderReview() {
  const list = DB.responses.slice().sort((a, b) => {
    if (a.role !== b.role) return a.role.localeCompare(b.role);
    return (b.submittedAt || "").localeCompare(a.submittedAt || "");
  });
  const byRole = {};
  for (const r of list) byRole[r.role] = (byRole[r.role] || 0) + 1;
  document.getElementById("reviewCount").textContent =
    list.length + " response" + (list.length === 1 ? "" : "s") +
    (list.length ? " · " + Object.keys(byRole).map(k => byRole[k] + " " + roleLabel(k).toLowerCase()).join(" · ") : "");
  document.getElementById("reviewList").innerHTML = list.map(responseCardHtml).join("");
  document.getElementById("reviewEmpty").hidden = list.length > 0;
}

/* ---------- export / import ---------- */
async function saveFile(fname, payload, mime) {
  const dl = await getDownloadsCap();
  if (dl) {
    try { await dl.save({ filename: fname, data: payload }); toast("Saved " + fname); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      /* fall through to other methods */
    }
  }
  try {
    const a = document.createElement("a");
    a.href = "data:" + (mime || "application/json") + ";charset=utf-8," + encodeURIComponent(payload);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Downloaded " + fname);
  } catch (e) {
    try { await navigator.clipboard.writeText(payload); toast("Copied to clipboard — paste into a file"); }
    catch (e2) { toast("Export failed"); }
  }
}
function exportBackup() {
  const stamp = new Date().toISOString().slice(0, 10);
  saveFile("momentum-staffq-" + stamp + ".json", JSON.stringify(DB, null, 2), "application/json");
}
function csvCell(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
function exportCsv() {
  const rows = [["responseId", "role", "name", "submittedAt", "section", "questionId", "question", "answer"]];
  for (const r of DB.responses) {
    for (const qid of Object.keys(r.answers)) {
      const v = r.answers[qid];
      if (v === undefined || v === null || String(v).trim() === "") continue;
      const hit = findQuestion(qid);
      rows.push([r.id, roleLabel(r.role), r.name || "", r.submittedAt || "",
        hit ? hit.section.title : "", qid, hit ? hit.q.label : "", v]);
    }
  }
  const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");
  const stamp = new Date().toISOString().slice(0, 10);
  saveFile("momentum-staffq-" + stamp + ".csv", csv, "text/csv");
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try { incoming = JSON.parse(reader.result); } catch (e) { toast("That file isn’t a valid backup"); return; }
    if (!incoming || !Array.isArray(incoming.responses)) { toast("That file isn’t a questionnaire backup"); return; }
    DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
    const added = mergeResponses(DB, incoming);
    if (!added) { toast("Nothing new in that backup"); renderReview(); return; }
    publishDb(null);
    if (MODE !== "local") toast("Merging " + added + " response" + (added === 1 ? "" : "s") + "…");
  };
  reader.readAsText(file);
}

/* ================= event wiring ================= */
document.getElementById("roleGrid").addEventListener("click", e => {
  const card = e.target.closest("[data-role]");
  if (!card) return;
  const existing = readDraft();
  if (existing && draftHasContent(existing) && existing.role !== card.dataset.role) {
    toast("Finish or discard the unfinished questionnaire above first");
    return;
  }
  if (existing && draftHasContent(existing)) { resumeQuestionnaire(); return; }
  startQuestionnaire(card.dataset.role);
});
document.getElementById("draftCard").addEventListener("click", async e => {
  const btn = e.target.closest("[data-dact]");
  if (!btn) return;
  if (btn.dataset.dact === "resume") { resumeQuestionnaire(); return; }
  const d = readDraft();
  const ok = await askConfirm({
    title: "Discard this unfinished questionnaire?",
    message: "The " + roleLabel(d ? d.role : "") + " questionnaire" + (d && d.name ? " for " + d.name : "") +
      " has not been submitted. Discarding it cannot be undone.",
    confirmLabel: "Discard",
    danger: true
  });
  if (!ok) return;
  clearDraft();
  renderHome();
  toast("Draft discarded");
});
document.getElementById("btnHome").addEventListener("click", () => showView("home"));
document.getElementById("btnDoneHome").addEventListener("click", () => showView("home"));
document.getElementById("nameBox").addEventListener("input", e => {
  if (!DRAFT) return;
  DRAFT.name = e.target.value;
  persistDraft();
});
document.getElementById("qForm").addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-qid]");
  if (!ta || !DRAFT) return;
  setAnswer(ta.dataset.qid, ta.value);
});
document.getElementById("qForm").addEventListener("click", e => {
  const btn = e.target.closest("button[data-qid]");
  if (!btn || !DRAFT) return;
  e.preventDefault();
  const qid = btn.dataset.qid, val = btn.dataset.val;
  const isOn = btn.classList.contains("on");
  document.querySelectorAll('#qForm [data-qid="' + qid + '"]').forEach(b => b.classList.remove("on"));
  if (isOn) { setAnswer(qid, ""); return; } // tap again to un-pick
  btn.classList.add("on");
  setAnswer(qid, btn.classList.contains("ratebtn") ? Number(val) : val);
});
document.getElementById("qForm").addEventListener("submit", e => e.preventDefault());
document.getElementById("btnSubmit").addEventListener("click", submitAnswers);
document.getElementById("btnReview").addEventListener("click", () => {
  showView(reviewUnlocked() ? "review" : "pin");
});
document.getElementById("btnPinGo").addEventListener("click", () => {
  if (document.getElementById("pinBox").value === REVIEW_PIN) {
    try { sessionStorage.setItem(REVIEW_OK_KEY, "1"); } catch (e) { /* ignore */ }
    document.getElementById("pinBox").value = "";
    showView("review");
  } else {
    toast("That PIN isn’t right");
  }
});
document.getElementById("pinBox").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("btnPinGo").click(); }
});
document.getElementById("btnExport").addEventListener("click", exportBackup);
document.getElementById("btnExportCsv").addEventListener("click", exportCsv);
document.getElementById("btnImport").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("reviewList").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  e.preventDefault();
  if (btn.dataset.act !== "del") return;
  const rec = DB.responses.find(r => r.id === btn.dataset.rid);
  if (!rec) { toast("That response is no longer here"); return; }
  const ok = await askConfirm({
    title: "Delete this response?",
    message: "The " + roleLabel(rec.role) + " response" + (rec.name ? " from " + rec.name : "") +
      " will be removed for everyone. This cannot be undone — export a backup first if you are unsure.",
    confirmLabel: "Delete response",
    danger: true
  });
  if (!ok) return;
  DB = MODE === "local" ? (readLocalMirror() || readDbBlock()) : readDbBlock();
  DB.responses = DB.responses.filter(r => r.id !== btn.dataset.rid);
  publishDb(null);
  if (MODE === "local") { renderReview(); toast("Response deleted"); }
});

/* ================= boot ================= */
DRAFT = readDraft();

getArtifactCap().then(cap => {
  let readonlyFlag = false;
  try { readonlyFlag = sessionStorage.getItem(READONLY_KEY) === "1"; } catch (e) { /* ignore */ }
  if (!cap) {
    setMode("local");
    const mirror = readLocalMirror();
    if (mirror) DB = mirror;
  } else if (readonlyFlag) {
    setMode("readonly");
  } else {
    setMode("shared");
  }

  // finish any submission that was in flight before the last reload
  let pending = null;
  try { pending = JSON.parse(sessionStorage.getItem(PENDING_KEY) || "null"); } catch (e) { /* ignore */ }
  if (pending && MODE === "shared") {
    if (responseExists(DB, pending)) {
      sessionStorage.removeItem(PENDING_KEY);
      clearDraft();
      showView("done");
      toast("Answers saved ✓");
    } else if ((pending.attempts || 0) < 2) {
      pending.attempts = (pending.attempts || 0) + 1;
      applyResponse(DB, pending);
      publishDb(pending);
      showView("home");
    } else {
      sessionStorage.removeItem(PENDING_KEY);
      toast("Submission didn’t stick — resume the draft and try again");
      showView("home");
    }
  } else {
    if (pending && MODE !== "shared") { try { sessionStorage.removeItem(PENDING_KEY); } catch (e) { /* ignore */ } }
    showView("home");
  }
});
</script>
